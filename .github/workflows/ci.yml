name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_consulting_charts.cjs
      - run: npx --yes @anthropic-ai/claude-code@2.1.314 plugin validate .
